---
layout: default
---
<article class="shell article-wrap">
  <header class="page-header"><a class="eyebrow" href="{{ '/journal' | relative_url }}">Journal</a><h1>{{ page.title }}</h1><p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p></header>
  <div class="prose">{{ content }}</div>
  <p class="back-link"><a href="{{ '/journal' | relative_url }}">← Back to the journal</a></p>
</article>
