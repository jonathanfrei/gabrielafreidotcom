<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="brand-name">Gabriela Frei</span><span class="brand-note">Music &amp; Ministry</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="sr-only">Open navigation</span><span aria-hidden="true"></span></button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      {% for item in site.navigation %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span aria-hidden="true">◐</span></button>
    </nav>
  </div>
</header>
