title: Gabriela Frei
description: Music, performances, reflections, and news from Gabriela Frei.
url: "https://www.gabrielafrei.com"
baseurl: ""
timezone: America/New_York

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:path
  events:
    output: true
    permalink: /events/:name
  discography:
    output: true
    permalink: /music/:name

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /:year/:month/:day/:title
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: events
    values:
      layout: event
  - scope:
      path: ""
      type: discography
    values:
      layout: release

navigation:
  - title: Home
    url: /
  - title: Music
    url: /music
  - title: Events
    url: /events
  - title: About
    url: /about
  - title: Journal
    url: /journal

social:
  youtube: "https://www.youtube.com/@gabrielafrei"

hero:
  eyebrow: Music · Faith · Story
  title: Songs from the heart, offered with grace.
  text: Gabriela Frei is a singer, pianist, and songwriter creating music rooted in faith, hope, and the beauty of the present moment.
  image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgMqOorH2zwHtadxSHsiBxJLW58vQXJC3BfX1JXGCwe1zVTb3zEkGEHj66e_7G7QhuBD3fz1j7appMJvC50yPdLtnMAH2mh-URq9bLAneX3jtuErhNoRmXxHsUb8QBVRhr4Xc9WS7SxiuL4/s1600/gaby2.jpg"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
